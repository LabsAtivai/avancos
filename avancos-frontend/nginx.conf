server {
    listen 3099;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A listagem segura fica disponível para leitura. Rotas de segredo e CRUD
    # permanecem bloqueadas até existir autenticação administrativa humana.
    location = /api/credenciais {
        if ($arg_completo = "true") { return 403; }
        if ($request_method != GET) { return 403; }
        proxy_pass http://avancos-backend:3098/api/credenciais;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/credenciais/ {
        return 403;
    }

    location /api/ {
        proxy_pass http://avancos-backend:3098/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
        # Timeout aumentado para chamadas ao Snov.io (múltiplas campanhas)
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
    }
}
