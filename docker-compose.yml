version: '3.8'
services:
  avancos-backend:
    build: ./avancos-backend
    container_name: avancos-backend
    restart: unless-stopped
    # Sem "ports": o backend não fica exposto no host; acesso só pela rede ativaai.
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME:-avancos_comerciais}
      PORT: 3098
      # Integração do Painel de Campanhas
      PAINEL_API_KEY: ${PAINEL_API_KEY}
      PAINEL_API_KEY_HEADER: ${PAINEL_API_KEY_HEADER:-x-api-key}
      PAINEL_RATE_LIMIT_POR_MIN: ${PAINEL_RATE_LIMIT_POR_MIN:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    networks:
      - ativaai

  avancos-frontend:
    build: ./avancos-frontend
    container_name: avancos-frontend
    restart: unless-stopped
    ports:
      - "3099:3099"
    depends_on:
      - avancos-backend
    networks:
      - ativaai

networks:
  ativaai:
    external: true
